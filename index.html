<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ryan Golden | Software Developer Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="css/base.css" rel="stylesheet">
    <link href="css/panels.css" rel="stylesheet">
    <link href="css/menus.css" rel="stylesheet">
    <link href="css/instructions.css" rel="stylesheet">
    <link href="css/mobile.css" rel="stylesheet">
    <link rel="icon" href="data:,">
</head>

<body>
    <h1>Ryan Golden - Software Developer</h1>
    <div style="width:100dvw;height:100dvh;position:relative;background:#000;overflow:hidden;">
        <canvas id="c" style="width:100%;height:100%;display:block;"></canvas>
        
        <div id="cube-instructions">
            <div class="desktop-instructions">
                Click + drag cube to navigate,
                Click face to explore
            </div>

            <div class="mobile-instructions">
                Touch + drag cube to navigate,
                Tap face to explore
            </div>
        </div>
        
        <div class="audio-fab-wrap">
            <button id="audio-fab" type="button" aria-label="Open audio controls">
                <img src="resources/speaker.png" alt="Audio">
            </button>

            <div id="audio-menu" class="audio-menu">
                <label class="audio-control">
                Sounds
                <input id="sfx-volume" type="range" min="0" max="100" step="1" value="35">
                </label>

                <label class="audio-control">
                Music
                <input id="music-volume" type="range" min="0" max="100" step="1" value="25">
                </label>

                <label class="audio-mute-row">
                <input id="mute-all-audio" type="checkbox">
                Mute All
                </label>
            </div>
        </div>

       <div class="color-fab-wrap">
            <button id="color-fab" type="button" aria-label="Open color controls">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2C9.2 5.2 5 9.3 5 13.4A7 7 0 0 0 19 13.4C19 9.3 14.8 5.2 12 2Z" />
                <circle cx="9" cy="15" r="1.2" />
                </svg>
            </button>

            <div id="color-menu" class="color-menu">
                <button type="button" class="color-btn amber" data-color="#FFB000">Terminal Amber</button>
                <button type="button" class="color-btn green" data-color="#33FF33">Terminal Green</button>
                <button type="button" class="color-btn purple" data-color="#a459ff">Gamecube Purple</button>
                <button type="button" class="color-btn blue" data-color="#0f8fff">PS2 Blue</button>
                <button type="button" class="color-btn white" data-color="#e7e7e7">Wii White</button>
                <button type="button" class="color-btn red" data-color="#ff2929">Gamesphere Red</button>
                
                <label for="color-picker" class="color-btn custom" id="custom-color-btn">
                Custom
                </label>

                <input
                id="color-picker"
                type="color"
                value="#ffb000"
                aria-label="Choose custom color"/>
            </div>
        </div>

        <div id="ui-layer"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/0panelData.js"></script>
    <script src="js/1config.js"></script>
    <script src="js/2setup.js"></script>
    <script src="js/3cube.js"></script>
    <script src="js/4audio.js"></script>
    <script src="js/5particles.js"></script>
    <script src="js/6controls.js"></script>
    <script src="js/7pointerControls.js"></script>
    <script src="js/8animation.js"></script>
    <script src="js/9uiCore.js"></script>
    <script src="js/10uiPanels.js"></script>
    <script src="js/11colorMenu.js"></script>
</body>
</html>
